<nav class="post-nav" aria-label="More posts">
  {% if page.previous %}
  <a class="prev" href="{{ page.previous.url | relative_url }}"><span class="label">&larr; Previous</span>{{ page.previous.title | escape }}</a>
  {% endif %}
  {% if page.next %}
  <a class="next" href="{{ page.next.url | relative_url }}"><span class="label">Next &rarr;</span>{{ page.next.title | escape }}</a>
  {% endif %}
</nav>
