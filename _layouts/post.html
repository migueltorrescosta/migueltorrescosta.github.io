---
layout: default
---

<article class="post">
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_string }}</time>
    {% for topic in page.categories %}<a href="{{ '/blog' | relative_url }}?topic={{ topic | downcase }}">{{ topic }}</a>{% endfor %}
    <span>{% include reading_time.html post=page %}</span>
  </p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  {% include post_navigation.html %}
</article>
