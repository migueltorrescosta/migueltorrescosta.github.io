title:               Miguel Torres Costa
url:                 https://blog.mptc.uk
baseurl:             ""

markdown:            kramdown
highlighter:         rouge

exclude:             ['README.md', 'CLAUDE.md', 'LICENSE', 'Gemfile', 'Gemfile.lock', 'vendor/bundle', 'renovate.json']

permalink:           posts/:title

sass:
  style:             :compressed
  sourcemap:         never

author:
  name:              Miguel Costa
  url:               https://blog.mptc.uk
  email:             miguelptcosta1995@gmail.com

# Post topics, in the order the Blog page's filter chips show them.
# Each post lists its topics in its `category:` front matter.
topics:              [Maths, Systems, Mind, Stories, Interactive, Software, Personal]

# The Goodreads shelf the Books page and Home's Books section show, as its public
# shelf widget. _plugins/goodreads.rb reads it on every build and falls back to
# the snapshot in _data/books.yml when it can't.
goodreads_widget:    https://www.goodreads.com/review/custom_widget/65376142?shelf=read&sort=date_added&order=d&num_books=200
