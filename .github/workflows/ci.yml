name: CI

# Checks only. deploy.yml builds and publishes the site on pushes to main.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Jekyll build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Same Gemfile and build command as deploy.yml.
      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

  react-sync:
    name: React components in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same command as README.md, "React components".
      - name: Regenerate assets/react_components from _react_src
        run: |
          npx --yes -p @babel/core@7.29.7 -p @babel/cli@7.29.7 -p @babel/preset-react@7.29.7 -c \
            'babel --no-babelrc --retain-lines --presets "$(dirname "$(command -v babel)")/../@babel/preset-react" _react_src --out-dir assets/react_components'

      - name: Fail if the committed components differ from the regenerated ones
        run: |
          git add --intent-to-add assets/react_components
          git diff --exit-code -- assets/react_components

  ci:
    name: ci
    if: always()
    needs: [build, react-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
